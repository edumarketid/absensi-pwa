<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu QR Code Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- LIBRARY QR CODE & SUPABASE SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .card-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
      .qr-card { page-break-inside: avoid; break-inside: avoid; }
    }
    .qr-card {
      width: 85.6mm;
      height: 53.98mm;
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-gray-800 p-4 sm:p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- PANEL FILTER & UNGGAH LOGO (NO PRINT) -->
    <div class="bg-white p-5 rounded-2xl shadow-md border border-gray-200 space-y-4 no-print">
      <div class="flex items-center justify-between border-b pb-3">
        <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-address-card text-indigo-600"></i> Cetak Kartu Presensi QR Code
        </h1>
        <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow transition">
          <i class="fa-solid fa-print"></i> Cetak Kartu
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Filter Kelas</label>
          <select id="filter-kelas" onchange="renderCards()" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-semibold">
            <option value="ALL">Semua Kelas</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Upload Logo Sekolah</label>
          <input type="file" id="upload-logo-sekolah" accept="image/*" onchange="uploadLogo('sekolah')" class="w-full p-1.5 bg-slate-50 border rounded-xl text-xs">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1">Upload Logo Daerah/Provinsi</label>
          <input type="file" id="upload-logo-daerah" accept="image/*" onchange="uploadLogo('daerah')" class="w-full p-1.5 bg-slate-50 border rounded-xl text-xs">
        </div>
      </div>
    </div>

    <!-- AREA CETAK KARTU -->
    <div id="card-container" class="card-grid grid grid-cols-1 md:grid-cols-2 gap-4 justify-items-center">
      <div class="col-span-full text-center text-xs text-gray-400 py-10">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-600"></i>
        <p>Memuat data siswa dan logo dari Supabase Storage...</p>
      </div>
    </div>

  </div>

  <script>
    // SUPABASE CLIENT INITIALIZATION
    const SUPABASE_URL = "https://nbwpnhshhpfqtmbwewgk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5id3BuaHNoaHBmcXRtYndld2drIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTQ1ODUsImV4cCI6MjEwNzk5MDU4NX0.2Ah6o8svWPMDEI1O3zOxytNyqBIjED7GXTxowNm1Ai4";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allStudents = [];
    let logoSekolahUrl = "";
    let logoDaerahUrl = "";
    let schoolName = "SMK NEGERI 1 WAKATOBI";

    window.onload = async () => {
      await loadSchoolSettings();
      await fetchLogosFromStorage();
      await fetchStudents();
    };

    async function loadSchoolSettings() {
      try {
        const { data } = await supabaseClient.from('pengaturan').select('*');
        if (data) {
          const cfg = {};
          data.forEach(item => cfg[item.kunci] = item.nilai);
          schoolName = cfg.SCHOOL_NAME || localStorage.getItem("SCHOOL_NAME") || "SMK NEGERI 1 WAKATOBI";
        }
      } catch (e) {
        console.error("Gagal memuat pengaturan sekolah:", e);
      }
    }

    async function fetchLogosFromStorage() {
      // Ambil Public URL untuk Logo Sekolah & Daerah dari Supabase Storage Bucket "media-sekolah"
      const { data: sekolahData } = supabaseClient.storage.from('media-sekolah').getPublicUrl('logo_sekolah.png');
      const { data: daerahData } = supabaseClient.storage.from('media-sekolah').getPublicUrl('logo_daerah.png');

      logoSekolahUrl = sekolahData ? sekolahData.publicUrl : "";
      logoDaerahUrl = daerahData ? daerahData.publicUrl : "";
    }

    async function fetchStudents() {
      try {
        // Mengambil data siswa dari Supabase
        const { data, error } = await supabaseClient
          .from('siswa')
          .select('*');

        if (error) throw error;

        // Normalisasi data agar fleksibel terhadap nama kolom huruf besar/kecil
        allStudents = (data || [])
          .filter(s => !s.STATUS || s.STATUS === 'Aktif' || s.active === true)
          .map(s => ({
            id_siswa: s.ID_SISWA || s.id_siswa,
            nama: s.NAMA_SISWA || s.nama,
            nisn: s.NISN || s.nisn || "-",
            kelas: s.KELAS || s.kelas,
            qr_code_key: s.QR_CODE_KEY || s.ID_SISWA || s.id_siswa
          }))
          .sort((a, b) => a.nama.localeCompare(b.nama));

        populateClassDropdown();
        renderCards();
      } catch (err) {
        document.getElementById('card-container').innerHTML = `<div class="col-span-full text-center text-xs text-red-500 py-6">Gagal memuat data siswa: ${err.message}</div>`;
      }
    }

    function populateClassDropdown() {
      const classes = [...new Set(allStudents.map(s => s.kelas))].filter(Boolean).sort();
      const select = document.getElementById('filter-kelas');
      select.innerHTML = '<option value="ALL">Semua Kelas</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderCards() {
      const selectedClass = document.getElementById('filter-kelas').value;
      const container = document.getElementById('card-container');
      container.innerHTML = "";

      const filtered = allStudents.filter(s => selectedClass === "ALL" || s.kelas === selectedClass);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-xs text-gray-500 py-6">Tidak ada data siswa terpilih.</div>`;
        return;
      }

      filtered.forEach((std) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = "qr-card bg-white border border-gray-300 rounded-xl p-3 shadow-sm flex flex-col justify-between relative overflow-hidden";
        
        cardDiv.innerHTML = `
          <!-- KOP KARTU -->
          <div class="flex items-center justify-between border-b pb-1.5 mb-1">
            <img src="${logoDaerahUrl}" onerror="this.style.display='none'" class="h-8 w-8 object-contain">
            <div class="text-center flex-1 px-1">
              <h2 class="text-[9px] font-black uppercase text-gray-800 leading-tight">${schoolName}</h2>
              <p class="text-[7px] text-gray-500 font-bold">KARTU PRESENSI DIGITAL</p>
            </div>
            <img src="${logoSekolahUrl}" onerror="this.style.display='none'" class="h-8 w-8 object-contain">
          </div>

          <!-- ISI KARTU (BIODATA & QR CODE) -->
          <div class="flex items-center justify-between gap-2 flex-1">
            <div class="space-y-1 text-left flex-1 min-w-0">
              <div>
                <span class="text-[7px] text-gray-400 block font-bold">NAMA SISWA:</span>
                <h3 class="text-xs font-black text-slate-900 truncate">${std.nama}</h3>
              </div>
              <div>
                <span class="text-[7px] text-gray-400 block font-bold">NISN / ID:</span>
                <p class="text-[10px] font-extrabold text-blue-900">${std.nisn !== '-' ? std.nisn : std.id_siswa}</p>
              </div>
              <div>
                <span class="text-[7px] text-gray-400 block font-bold">KELAS:</span>
                <span class="inline-block px-1.5 py-0.5 bg-blue-50 text-blue-800 font-black text-[9px] rounded-md border border-blue-200">${std.kelas}</span>
              </div>
            </div>

            <!-- CONTAINER QR CODE -->
            <div class="flex flex-col items-center justify-center border p-1 rounded-lg bg-slate-50">
              <div id="qrcode-${std.id_siswa}"></div>
              <span class="text-[7px] font-mono text-gray-500 mt-0.5">${std.id_siswa}</span>
            </div>
          </div>
        `;

        container.appendChild(cardDiv);

        // Generate QR Code menggunakan nilai QR_CODE_KEY / ID Siswa
        new QRCode(document.getElementById(`qrcode-${std.id_siswa}`), {
          text: String(std.qr_code_key || std.id_siswa).trim(),
          width: 68,
          height: 68,
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    }

    async function uploadLogo(type) {
      const inputId = type === 'sekolah' ? 'upload-logo-sekolah' : 'upload-logo-daerah';
      const fileInput = document.getElementById(inputId);
      const file = fileInput.files[0];
      if (!file) return;

      const fileName = type === 'sekolah' ? 'logo_sekolah.png' : 'logo_daerah.png';

      try {
        // Upload / Overwrite logo ke Supabase Storage Bucket "media-sekolah"
        const { error } = await supabaseClient.storage
          .from('media-sekolah')
          .upload(fileName, file, { upsert: true });

        if (error) throw error;

        alert(`Logo ${type} berhasil diunggah ke Supabase Storage!`);
        await fetchLogosFromStorage();
        renderCards();
      } catch (err) {
        alert("Gagal mengunggah logo: " + err.message);
      }
    }
  </script>
</body>
</html>
